name: Zola docs
description: Build a Zola site with the shared zola-docs theme, deploy it to GitHub Pages and purge the Cloudflare cache
author: Gabriel Koerich

branding:
  icon: book-open
  color: blue

inputs:
  path:
    description: Directory of the Zola site, relative to the repository root
    default: "."
  zola-version:
    description: Zola release to build with
    default: "0.18.0"
  base-url:
    description: Override base_url from config.toml
    default: ""
  drafts:
    description: Include draft pages
    default: "false"
  upload:
    description: Upload the output as a GitHub Pages artifact
    default: "true"
  build-command:
    description: Command to run in the site directory instead of zola build, for sites that generate pages first
    default: ""
  readme:
    description: Generate the site from this README, one page per ## section, instead of building an existing site
    default: ""
  extra:
    description: TOML lines added to [extra] of a README site, such as nav, the theme already sets the header and menu
    default: ""
  deploy:
    description: Deploy the uploaded artifact to GitHub Pages, the job needs pages and id-token write and the github-pages environment
    default: "false"
  cloudflare-token:
    description: Cloudflare API token with Cache Purge permission, purges the deployed site after the deploy
    default: ""
  cloudflare-zone:
    description: Cloudflare zone to purge, the default is gabrielkoerich.com
    default: "b4f279fbdc18c1d62d60751dcefbc03e"

outputs:
  output-dir:
    description: Directory holding the built site
    value: ${{ steps.build.outputs.output-dir }}
  page-url:
    description: URL of the deployed site
    value: ${{ steps.deployment.outputs.page_url }}

runs:
  using: composite
  steps:
    - name: Pick the site directory
      id: site
      shell: bash
      env:
        SITE: ${{ inputs.path }}
        README: ${{ inputs.readme }}
        EXTRA: ${{ inputs.extra }}
        BASE_URL: ${{ inputs.base-url }}
        ZOLA_VERSION: ${{ inputs.zola-version }}
        GENERATOR: ${{ github.action_path }}/scripts/readme-site.py
      run: |
        if [ -n "$README" ]; then
          export OUT_DIR="$SITE/.zola-build"
          python3 "$GENERATOR"
          echo "dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
        else
          echo "dir=$SITE" >> "$GITHUB_OUTPUT"
        fi

    - name: Install the zola-docs theme
      shell: bash
      env:
        SITE: ${{ steps.site.outputs.dir }}
        THEME_SRC: ${{ github.action_path }}/theme
      run: |
        dest="$SITE/themes/zola-docs"
        rm -rf "$dest"
        mkdir -p "$SITE/themes"
        cp -R "$THEME_SRC" "$dest"
        if ! grep -Eq '^theme *= *"zola-docs"' "$SITE/config.toml"; then
          echo "::warning::$SITE/config.toml does not set theme = \"zola-docs\", the theme is installed but unused"
        fi

    - name: Install Zola
      shell: bash
      env:
        ZOLA_VERSION: ${{ inputs.zola-version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)  target="x86_64-unknown-linux-gnu" ;;
          Linux-ARM64) target="aarch64-unknown-linux-gnu" ;;
          macOS-ARM64) target="aarch64-apple-darwin" ;;
          macOS-X64)  target="x86_64-apple-darwin" ;;
          *) echo "::error::No Zola build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        bin="$RUNNER_TEMP/zola-bin"
        mkdir -p "$bin"
        curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${target}.tar.gz" | tar -xzf - -C "$bin"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Build
      id: build
      shell: bash
      env:
        SITE: ${{ steps.site.outputs.dir }}
        BASE_URL: ${{ inputs.base-url }}
        DRAFTS: ${{ inputs.drafts }}
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        cd "$SITE"
        if [ -n "$BUILD_COMMAND" ]; then
          bash -c "$BUILD_COMMAND"
        else
          args=()
          [ -n "$BASE_URL" ] && args+=(--base-url "$BASE_URL")
          [ "$DRAFTS" = "true" ] && args+=(--drafts)
          zola build "${args[@]}"
        fi
        echo "output-dir=$SITE/public" >> "$GITHUB_OUTPUT"

    - name: Upload Pages artifact
      if: inputs.upload == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ steps.build.outputs.output-dir }}

    - name: Deploy to GitHub Pages
      id: deployment
      if: inputs.deploy == 'true' && inputs.upload == 'true'
      uses: actions/deploy-pages@v4

    # After the deploy, or Cloudflare can fetch and cache the old site again
    - name: Purge Cloudflare cache
      id: purge
      if: inputs.deploy == 'true' && inputs.upload == 'true'
      shell: bash
      env:
        CF_API_TOKEN: ${{ inputs.cloudflare-token }}
        ZONE_ID: ${{ inputs.cloudflare-zone }}
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        if [ -z "$CF_API_TOKEN" ]; then
          echo "::warning::No cloudflare-token was given, the cache was not purged"
          exit 0
        fi

        purge() {
          echo "Purging $1"
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$1")
          echo "$response"
          if echo "$response" | grep -q '"success":true'; then
            echo "purged=true" >> "$GITHUB_OUTPUT"
            return 0
          fi

          return 1
        }

        # Only this site's pages, so a deploy leaves the rest of the zone cached
        url="${PAGE_URL#*://}"
        host="${url%%/*}"
        if [ -n "$host" ] && [ "$url" != "$host/" ] && purge "{\"prefixes\":[\"$url\"]}"; then
          exit 0
        fi

        if [ -n "$host" ] && purge "{\"hosts\":[\"$host\"]}"; then
          exit 0
        fi

        echo "::warning::Purging $url failed, purging the whole zone"
        purge '{"purge_everything":true}' || echo "::warning::Cloudflare cache purge failed"

    # Cloudflare caches per data center, with Tiered Cache this also fills the upper tier every region reads from
    - name: Warm the Cloudflare cache
      if: steps.purge.outputs.purged == 'true'
      shell: bash
      env:
        OUTPUT: ${{ steps.build.outputs.output-dir }}
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
      run: |
        if [ ! -f "$OUTPUT/sitemap.xml" ]; then
          echo "::notice::No sitemap.xml in $OUTPUT, the cache was not warmed"
          exit 0
        fi

        # The sitemap holds base_url, which may be http while the site is served over https
        site="https://${PAGE_URL#*://}"
        pages="$RUNNER_TEMP/warm-pages.txt"
        list="$RUNNER_TEMP/warm-urls.txt"
        grep -o '<loc>[^<]*</loc>' "$OUTPUT/sitemap.xml" | sed -e 's#</\{0,1\}loc>##g' -e 's#^http://#https://#' > "$pages"
        {
          cat "$pages"
          # Cloudflare caches the form without the trailing slash on its own, as the redirect to the slash form
          grep '/$' "$pages" | sed 's#/$##'
          # The stylesheets every page loads, linked with a cachebust query that is part of the cache key
          grep -o 'href="\{0,1\}[^" >]*\.css[^" >]*' "$OUTPUT/index.html" | sed -e 's#^href="\{0,1\}##' -e 's#^http://#https://#'
        } | grep -F "${site%/}" | sort -u | head -500 > "$list"

        # Counts each status code, cache status and the Cloudflare data center that answered
        fetch_all() {
          xargs -P 8 -n 1 curl -s -o /dev/null --max-time 20 -w '%{http_code} %header{cf-cache-status} %header{cf-ray}\n' < "$list" \
            | awk '{ n = split($3, ray, "-"); print $1, ($2 == "" ? "-" : $2), ray[n] }' | sort | uniq -c
        }

        echo "Warming $(wc -l < "$list") URLs under $site"
        fetch_all
        echo "The same URLs again, a HIT means the data center kept them"
        fetch_all
