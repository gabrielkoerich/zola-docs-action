name: Zola docs
description: Build a Zola site with the shared zola-docs theme and upload it for GitHub Pages
author: Gabriel Koerich

branding:
  icon: book-open
  color: blue

inputs:
  path:
    description: Directory of the Zola site, relative to the repository root
    default: "."
  zola-version:
    description: Zola release to build with
    default: "0.18.0"
  base-url:
    description: Override base_url from config.toml
    default: ""
  drafts:
    description: Include draft pages
    default: "false"
  upload:
    description: Upload the output as a GitHub Pages artifact
    default: "true"
  build-command:
    description: Command to run in the site directory instead of zola build, for sites that generate pages first
    default: ""
  readme:
    description: Generate the site from this README, one page per ## section, instead of building an existing site
    default: ""
  extra:
    description: TOML lines added to [extra] of a README site, for author, home_url, tagline or nav
    default: ""

outputs:
  output-dir:
    description: Directory holding the built site
    value: ${{ steps.build.outputs.output-dir }}

runs:
  using: composite
  steps:
    - name: Pick the site directory
      id: site
      shell: bash
      env:
        SITE: ${{ inputs.path }}
        README: ${{ inputs.readme }}
        EXTRA: ${{ inputs.extra }}
        BASE_URL: ${{ inputs.base-url }}
        ZOLA_VERSION: ${{ inputs.zola-version }}
        GENERATOR: ${{ github.action_path }}/scripts/readme-site.py
      run: |
        if [ -n "$README" ]; then
          export OUT_DIR="$SITE/.zola-build"
          python3 "$GENERATOR"
          echo "dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
        else
          echo "dir=$SITE" >> "$GITHUB_OUTPUT"
        fi

    - name: Install the zola-docs theme
      shell: bash
      env:
        SITE: ${{ steps.site.outputs.dir }}
        THEME_SRC: ${{ github.action_path }}/theme
      run: |
        dest="$SITE/themes/zola-docs"
        rm -rf "$dest"
        mkdir -p "$SITE/themes"
        cp -R "$THEME_SRC" "$dest"
        if ! grep -Eq '^theme *= *"zola-docs"' "$SITE/config.toml"; then
          echo "::warning::$SITE/config.toml does not set theme = \"zola-docs\", the theme is installed but unused"
        fi

    - name: Install Zola
      shell: bash
      env:
        ZOLA_VERSION: ${{ inputs.zola-version }}
      run: |
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)  target="x86_64-unknown-linux-gnu" ;;
          Linux-ARM64) target="aarch64-unknown-linux-gnu" ;;
          macOS-ARM64) target="aarch64-apple-darwin" ;;
          macOS-X64)  target="x86_64-apple-darwin" ;;
          *) echo "::error::No Zola build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
        esac
        bin="$RUNNER_TEMP/zola-bin"
        mkdir -p "$bin"
        curl -sSfL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-${target}.tar.gz" | tar -xzf - -C "$bin"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Build
      id: build
      shell: bash
      env:
        SITE: ${{ steps.site.outputs.dir }}
        BASE_URL: ${{ inputs.base-url }}
        DRAFTS: ${{ inputs.drafts }}
        BUILD_COMMAND: ${{ inputs.build-command }}
      run: |
        cd "$SITE"
        if [ -n "$BUILD_COMMAND" ]; then
          bash -c "$BUILD_COMMAND"
        else
          args=()
          [ -n "$BASE_URL" ] && args+=(--base-url "$BASE_URL")
          [ "$DRAFTS" = "true" ] && args+=(--drafts)
          zola build "${args[@]}"
        fi
        echo "output-dir=$SITE/public" >> "$GITHUB_OUTPUT"

    - name: Upload Pages artifact
      if: inputs.upload == 'true'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ steps.build.outputs.output-dir }}
