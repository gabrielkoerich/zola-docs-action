{% extends "base.html" %}

{% block content %}
<div class="docs-layout">
    <nav class="docs-sidebar">
        <ul>
            {% set parent = get_section(path=page.ancestors | last) %}
            {% for p in parent.pages %}
            <li{% if p.path == page.path %} class="active"{% endif %}>
                <a href="{{ p.permalink | safe }}">{{ p.extra.short_title | default(value=p.title) }}</a>
            </li>
            {% endfor %}
        </ul>
    </nav>
    <article class="docs-content">
        <h1>{{ page.title }}</h1>
        {{ page.content | safe }}
    </article>
</div>
{% endblock content %}
